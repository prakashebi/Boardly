version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: boardly
      POSTGRES_PASSWORD: boardly
      POSTGRES_DB: boardly
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardly -d boardly"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://boardly:boardly@db:5432/boardly
      SECRET_KEY: change-me-in-production
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

  # OpenSearch — opt-in via: docker compose --profile opensearch up
  # Set OPENSEARCH_PASSWORD in your root .env file before starting.
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    profiles: ["opensearch"]
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD}
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' https://localhost:9200 | grep -qE '200|401'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
  opensearch_data:
